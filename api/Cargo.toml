[package]
name = "dog-shop-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "dog_shop_api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
calamine = "0.36.1"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
form_urlencoded = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "pool",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls-tls",
] }
md-5 = "0.10"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring",
  "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "request-id", "set-header", "trace"] }
tower_governor = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
http-body-util = { version = "0.1", features = ["channel"] }
rust_xlsxwriter = "0.99.0"
tempfile = "3.27.0"
